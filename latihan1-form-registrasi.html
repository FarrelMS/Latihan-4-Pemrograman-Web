<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Registrasi Mahasiswa</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f0f2f5;
        display: flex;
        justify-content: center;
        padding: 40px 20px;
      }
      .card {
        background: #fff;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 500px;
      }
      h2 {
        text-align: center;
        margin-bottom: 20px;
      }
      .form-group {
        position: relative;
        margin-bottom: 15px;
      }
      label {
        display: block;
        margin-bottom: 5px;
        font-size: 14px;
        font-weight: bold;
      }
      input,
      select {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
        font-size: 14px;
      }
      .saran-box {
        position: absolute;
        width: 100%;
        background: #fff;
        border: 1px solid #ccc;
        border-top: none;
        z-index: 10;
        display: none;
        max-height: 150px;
        overflow-y: auto;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }
      .saran-item {
        padding: 10px;
        cursor: pointer;
        border-bottom: 1px solid #eee;
      }
      .saran-item:hover {
        background-color: #f1f1f1;
      }
      .btn-group {
        margin-top: 20px;
        display: flex;
        gap: 10px;
      }
      button {
        padding: 10px 20px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        color: white;
        font-weight: bold;
      }
      .btn-send {
        background-color: #007bff;
      }
      .btn-send:hover {
        background-color: #0056b3;
      }
      .btn-reset {
        background-color: #007bff;
      }
      .btn-reset:hover {
        background-color: #0056b3;
      }
      .msg-error {
        color: red;
        font-size: 13px;
        margin-top: 10px;
      }
      .msg-success {
        color: green;
        font-size: 14px;
        margin-top: 10px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>FORM REGISTRASI</h2>
      <form id="formRegistrasi">
        <div class="form-group">
          <label for="inputNama">Nama Mahasiswa:</label>
          <input
            type="text"
            id="inputNama"
            placeholder="Ketik huruf awal nama..."
            autocomplete="off"
          />
          <div id="wadahSaran" class="saran-box"></div>
        </div>

        <div class="form-group">
          <label for="inputNim">NIM:</label>
          <input
            type="text"
            id="inputNim"
            placeholder="Masukkan NIM"
            readonly
          />
        </div>

        <div class="form-group">
          <label for="pilihMk">Mata Kuliah:</label>
          <select id="pilihMk">
            <option value="">Pilih Mata Kuliah</option>
            <option value="Pemrograman Web">Pemrograman Web</option>
            <option value="Struktur Data">Struktur Data</option>
            <option value="Jaringan Komputer">Jaringan Komputer</option>
          </select>
        </div>

        <div class="form-group">
          <label for="pilihDosen">Dosen:</label>
          <select id="pilihDosen">
            <option value="">Pilih Dosen</option>
            <option value="Dr. Budi Santoso">Dr. Budi Santoso</option>
            <option value="Siti Aminah, M.Kom">Siti Aminah, M.Kom</option>
          </select>
        </div>

        <div id="pesanError" class="msg-error"></div>
        <div id="pesanSukses" class="msg-success"></div>

        <div class="btn-group">
          <button type="submit" class="btn-send">Send</button>
          <button type="reset" id="btnReset" class="btn-reset">Reset</button>
        </div>
      </form>
    </div>

    <script src="latihan1-form-registrasi.js"></script>
  </body>
</html>
