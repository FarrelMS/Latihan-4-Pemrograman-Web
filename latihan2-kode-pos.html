<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Pencarian Kode Pos</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f0f2f5;
        display: flex;
        justify-content: center;
        padding: 40px 20px;
      }
      .card {
        background: #fff;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 500px;
      }
      h2 {
        text-align: center;
        margin-bottom: 20px;
      }
      .form-group {
        margin-bottom: 15px;
      }
      label {
        display: block;
        margin-bottom: 5px;
        font-size: 14px;
      }
      select {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 14px;
      }
      select:disabled {
        background-color: #e9ecef;
      }
      button {
        padding: 10px 20px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        margin-top: 10px;
        font-weight: bold;
      }
      button:hover {
        background-color: #0056b3;
      }
      .hasil-box {
        margin-top: 20px;
        padding: 15px;
        background: #e2f0d9;
        border: 1px solid #c5e0b4;
        border-radius: 4px;
        display: none;
        color: #385723;
      }
      .note {
        font-size: 12px;
        color: #777;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>PENCARIAN KODE POS</h2>

      <div class="form-group">
        <label>Provinsi:</label>
        <select id="cbProvinsi">
          <option value="">Pilih Provinsi</option>
        </select>
      </div>

      <div class="form-group">
        <label>Kabupaten / Kota:</label>
        <select id="cbKota" disabled>
          <option value="">Pilih Kabupaten / Kota</option>
        </select>
      </div>

      <div class="form-group">
        <label>Kecamatan:</label>
        <select id="cbKecamatan" disabled>
          <option value="">Pilih Kecamatan</option>
        </select>
      </div>

      <button id="btnCari">Cari</button>

      <div id="boxHasil" class="hasil-box"></div>
      <div class="note">*Data contoh (sebagian daerah) untuk latihan.</div>
    </div>

    <script src="latihan2-kode-pos.js"></script>
  </body>
</html>
