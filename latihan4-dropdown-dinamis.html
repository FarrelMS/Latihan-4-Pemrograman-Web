<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Dropdown Dinamis</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f0f2f5;
        display: flex;
        justify-content: center;
        padding: 40px 20px;
      }
      .card {
        background: #fff;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 450px;
      }
      h2 {
        text-align: center;
        margin-bottom: 25px;
      }
      .form-group {
        margin-bottom: 20px;
      }
      label {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        color: #333;
      }
      select {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 14px;
      }
      select:disabled {
        background-color: #f9f9f9;
        color: #aaa;
      }
      .output-box {
        margin-top: 20px;
        font-weight: bold;
        color: #0056b3;
        text-align: center;
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Dropdown Dinamis</h2>

      <div class="form-group">
        <label>Provinsi:</label>
        <select id="selProv">
          <option value="">-- Pilih Provinsi --</option>
        </select>
      </div>

      <div class="form-group">
        <label>Kota / Kabupaten:</label>
        <select id="selKota" disabled>
          <option value="">-- Pilih Kota --</option>
        </select>
      </div>

      <div id="hasilPilihan" class="output-box"></div>
    </div>

    <script src="latihan4-dropdown-dinamis.js"></script>
  </body>
</html>
